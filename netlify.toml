# Netlify settings for the Hindholistics website.
# The site is plain HTML: no build step, publish this folder as it is.
[build]
  publish = "."
  command = ""

# Always send visitors to https://www.hindholistics.com (one address is better for Google)
[[redirects]]
  from = "https://hindholistics.com/*"
  to = "https://www.hindholistics.com/:splat"
  status = 301
  force = true

# Keep the zip and guide out of reach of visitors (they stay in GitHub)
[[redirects]]
  from = "/GUIDE.md"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/hindholistics%20website.zip"
  to = "/"
  status = 301
  force = true

# Correct file type for the web app manifest (name + icons for phones and browsers)
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Cache images for a week so the site loads fast on return visits
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The shared stylesheet changes when the design changes: cache it for one hour only
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Basic security headers for every page (do not affect how Google crawls or renders the site)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
